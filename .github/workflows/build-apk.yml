
name: Build Hasaki Sale Hunter APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HasakiSaleHunter-Android-with-APK-builder.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q HasakiSaleHunter-Android-with-APK-builder.zip -d project
          find project -name settings.gradle.kts

      - name: Build APK
        run: |
          cd project/HasakiSaleHunter-Android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HasakiSaleHunter-APK
          path: project/HasakiSaleHunter-Android/app/build/outputs/apk/debug/app-debug.apk
